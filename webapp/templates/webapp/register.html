{% extends "webapp/base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">✦</div>

            <h1>Create your AgentForge account</h1>

            <p>
                Register to start building software with autonomous AI agents.
            </p>
        </div>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?

            <a href="{% url 'login' %}">
                Sign in
            </a>
        </div>

    </div>

</div>

<style>

.auth-page {
    min-height: 75vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    font-size: 24px;
}

.auth-header h1 {
    margin-bottom: 10px;
    font-size: 28px;
}

.auth-header p {
    color: #6b7280;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

.form-group input:focus {
    border-color: #6366f1;
}

.auth-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    background: #111827;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

.auth-button:hover {
    opacity: 0.9;
}

.auth-error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    color: #6b7280;
}

.auth-footer a {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
}

</style>

{% endblock %}
