{% extends "webapp/base.html" %}

{% block title %}Login | AgentForge{% endblock %}

{% block content %}

<style>

.login-page {
    min-height: calc(100vh - 150px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 50px 20px;
}

.login-card {
    width: 100%;
    max-width: 430px;

    background: white;

    border: 1px solid #eaecf0;

    border-radius: 18px;

    padding: 36px;

    box-shadow:
        0 10px 30px
        rgba(16, 24, 40, 0.08);
}

.login-icon {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    border-radius: 14px;

    background: #eef2ff;

    color: #4f46e5;

    font-size: 25px;
}

.login-title {
    margin: 0 0 8px;

    font-size: 28px;

    font-weight: 800;

    color: #101828;
}

.login-description {
    margin: 0 0 28px;

    color: #667085;

    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    color: #344054;

    font-size: 14px;

    font-weight: 650;
}

.form-group input {
    width: 100%;

    padding: 12px 13px;

    border: 1px solid #d0d5dd;

    border-radius: 9px;

    outline: none;

    font-size: 14px;
}

.form-group input:focus {
    border-color: #4f46e5;

    box-shadow:
        0 0 0 3px
        rgba(79, 70, 229, 0.1);
}

.login-submit {
    width: 100%;

    margin-top: 8px;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background: #4f46e5;

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.login-submit:hover {
    background: #4338ca;
}

.error-message {
    margin-bottom: 18px;

    padding: 11px 13px;

    border-radius: 9px;

    background: #fef3f2;

    color: #b42318;

    font-size: 13px;
}

</style>


<div class="login-page">

    <div class="login-card">

        <div class="login-icon">
            ✦
        </div>

        <h1 class="login-title">
            Welcome back
        </h1>

        <p class="login-description">
            Sign in to continue working with AgentForge.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
