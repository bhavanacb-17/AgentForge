{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AgentForge{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f7f9fc;
            color: #172033;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e7eaf0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 42px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 21px;
            font-weight: 700;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #635bff, #8b5cf6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .brand-text {
            color: #171b2d;
        }

        .brand-text span {
            color: #635bff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: #667085;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #635bff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
        }

        .btn-outline {
            background: white;
            color: #475467;
            border: 1px solid #d9dee8;
        }

        .btn-primary {
            background: #635bff;
            color: white;
        }

        .btn-primary:hover {
            background: #5148e5;
        }

        .page-container {
            max-width: 1400px;
            margin: auto;
            padding: 40px;
        }

        .footer {
            margin-top: 60px;
            padding: 25px 40px;
            border-top: 1px solid #e7eaf0;
            color: #98a2b3;
            font-size: 13px;
            text-align: center;
            background: white;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="navbar">

        <a href="/" class="brand">
            <div class="brand-icon">A</div>
            <div class="brand-text">
                Agent<span>Forge</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard/">Projects</a>
            <a href="/features/">Features</a>
            <a href="/how-it-works/">How It Works</a>
        </div>

        <div class="nav-actions">

            <a
                href="{% url 'login' %}"
                class="btn btn-outline"
            >
                Login
            </a>
        
            <a
                href="{% url 'dashboard' %}"
                class="btn btn-primary"
            >
                Open Workspace
            </a>
        
        </div>

    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        AgentForge — Autonomous Multi-Agent Software Engineering Platform
    </footer>

</body>
</html>
